<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brouwketel instellen</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 1.5rem 1rem;
      background: #edf2ed;
      color: #19241d;
      font: 1rem/1.5 Inter, system-ui, sans-serif;
    }
    main {
      width: min(100%, 34rem);
      margin: 0 auto;
      padding: clamp(1.25rem, 5vw, 2rem);
      background: white;
      border: 1px solid #cad6cd;
      border-radius: 1rem;
    }
    h1 { margin: 0 0 1.25rem; font-size: 1.7rem; line-height: 1.2; }
    fieldset { margin: 0 0 1.25rem; padding: 0; border: 0; }
    legend { padding: 0; font-size: 1.125rem; font-weight: 700; }
    label { display: block; margin-top: .7rem; font-weight: 600; }
    input, button { font: inherit; }
    input {
      display: block;
      width: 100%;
      padding: .6rem .7rem;
      margin: .2rem 0;
      border: 1px solid #8b9c90;
      border-radius: .45rem;
    }
    small { color: #4b5d50; }
    :focus-visible { outline: 3px solid #276a4a; outline-offset: 3px; }
    button {
      padding: .7rem 1rem;
      border: 0;
      border-radius: .45rem;
      background: #225b3f;
      color: white;
      font-weight: 650;
      cursor: pointer;
    }
    button:hover { background: #184630; }
  </style>
</head>
<body>
  <main>
    <h1>Brouwketel instellen</h1>
    <form method="post" action="/opslaan" accept-charset="UTF-8" autocomplete="off">
      <fieldset>
        <legend>Wifi</legend>
        <label for="ssid">Netwerknaam (SSID)</label>
        <input id="ssid" name="ssid" required maxlength="32" spellcheck="false" autocapitalize="none">
        <label for="wifi_wachtwoord">Wifiwachtwoord</label>
        <input id="wifi_wachtwoord" name="wifi_wachtwoord" type="password" minlength="8" maxlength="63"
               aria-describedby="wifi_hulp">
        <small id="wifi_hulp">Laat leeg voor een open netwerk.</small>
      </fieldset>
      <fieldset>
        <legend>MQTT</legend>
        <label for="mqtt_host">Broker</label>
        <input id="mqtt_host" name="mqtt_host" required maxlength="253" placeholder="192.168.0.25"
               spellcheck="false" autocapitalize="none" aria-describedby="broker_hulp">
        <small id="broker_hulp">Een hostname of IPv4-adres.</small>
        <label for="mqtt_poort">Poort</label>
        <input id="mqtt_poort" name="mqtt_poort" required inputmode="numeric" pattern="[0-9]{1,5}"
               maxlength="5" value="1883">
        <label for="ketel_id">Ketel-ID</label>
        <input id="ketel_id" name="ketel_id" required maxlength="32" placeholder="ketel-01"
               spellcheck="false" autocapitalize="none" aria-describedby="id_hulp">
        <small id="id_hulp">Letters, cijfers, koppeltekens en underscores.</small>
      </fieldset>
      <button type="submit">Opslaan en verbinden</button>
    </form>
  </main>
</body>
</html>
